[gwas]
# Input: ``gwas export`` and ``gwas workflow`` take exactly one of ``--mt`` (a
# single MatrixTable) or ``--manifest`` (the Filter stage's manifest.json.gz).
# With ``--manifest``, one dataset is built per selected table -- the
# high-quality basis, each filter's matrix and each filter-region matrix --
# selected by ``--include``/``--exclude`` (tokens match a label, filter name or
# region name; include first, then exclude). ``gwas workflow`` composes export,
# regenie and load into one deterministic DAG in a single invocation.
#
# The export applies the ``min_case_count`` gate and writes only the selected
# phenotype columns, so the exported phenotype table is the single source of
# truth every downstream stage reads.
log_dir = "/ceph01/scratch/brand/Projects/gnomad/gwas/100000bp/logs"
output_dir = "/ceph01/scratch/brand/Projects/gnomad/gwas/100000bp/output"
metadata_csv = "/path/to/alopecia-areata.radar.covid.md.csv"
case_cohort = "alopecia-areata"
control_cohorts = ["radar"]
drop_cohorts = ["covid"]
rare_variants_maf = 0.01
min_cadd = 20.0
intercept = true
# existing runner knobs stay: log_dir, output_dir, snakemake,
# min_case_count, min_mac, min_geno_frac, min_maf, hwe, snps_only, min_n_snps.
#
# ``min_n_snps`` is the deterministic size floor: tables with fewer variants
# (or no recorded count) are dropped at inventory selection, before any stage
# runs. The default targets WGS.

# The regenie chunk count is now data-driven: the run stage derives it from each
# dataset's recorded variant count, targeting this many variants per split
# (``n_chunks`` has been removed).
variants_per_split = 100000

[gwas.responses]
# The case/control response is always produced; this names it.
case = "case"
# Controls are missing for the ``set`` responses below.
case_only = true

# Each column is one response source: ``set`` columns fan out per distinct
# value (minus ``exclude``); ``binary``/``quantitative`` columns are used
# directly. ``metadata_field`` names the metadata CSV column and defaults to
# ``name``.
[[gwas.responses.columns]]
name = "comorbidities"
kind = "set"
exclude = ["hypertension", "thyroid"]
[[gwas.responses.columns]]
name = "comorbidities_thyroid"
kind = "set"
exclude = ["other_ai_thyroid_disease"]
[[gwas.responses.columns]]
name = "other_autoimmune_comorbidities"
kind = "set"
exclude = []

# Covariates regenie is adjusted for, in output order. `metadata_field` names
# the external CSV column; `age` is the explicit birthdate -> age rewrite and
# `ancestry.pca_scores` is an array field fanned out per `indices`.
[[gwas.covariates]]
name = "age"
metadata_field = "birthdate"
[[gwas.covariates]]
name = "sex"
metadata_field = "sex"
[[gwas.covariates]]
name = "ancestry.pca_scores"
indices = [0, 1, 2]

[[gwas.regions]]
kind = "gene"

[filter.resources]
constraints = "/home/brand/scratch/annotation/hail/gnomad.v4.1.constraint_metrics.ht"

[[filter.filters]]
name = "rare_clinvar_pathogenic"
max_gnomad_af = 0.01
filter_clinvar_pathogenic = true

[[filter.filters]]
name = "all_clinvar_pathogenic"
filter_clinvar_pathogenic = true

[[filter.filters]]
name = "rare_deleterious_missense"
max_gnomad_af = 0.01
min_cadd = 20.0
impact = ["HIGH", "MODERATE"]

[[filter.filters]]
name = "rare_high_impact"
max_gnomad_af = 0.01
impact = ["HIGH"]

[[filter.filters]]
name = "all_lof"
impact = ["HIGH", "MODERATE"]

[[filter.filters]]
name = "rare_lof_constrained"
max_gnomad_af = 0.01
min_pLI = 0.9
min_z_score = 5.0
min_cadd = 20.0
impact = ["HIGH", "MODERATE"]

[[filter.filters]]
name = "common_variants"
min_gnomad_af = 0.05

[[filter.filters]]
name = "rare_variants"
max_gnomad_af = 0.01

[[filter.filters]]
name = "clinvar_pathogenic_lof"
min_cadd = 20.0
impact = ["HIGH", "MODERATE"]
filter_clinvar_pathogenic = true

[[filter.filters]]
name = "splice_site_variants"
filter_splice_variants = true

[browser_export]
# Optional passthrough annotations. The browser's mandatory columns
# (locus/alleles/variant_id/xpos/rsids/caid/exome/genome/joint/
# transcript_consequences/in_silico_predictors/coverage) are always written.
# `joint`, `genome.quality_metrics` and `coverage` are synthesized from required
# source columns (freq/freq_meta, grpmax, fafmax, histograms, filters,
# coverage_stats/coverage_stats_meta); those source fields are consumed and must
# not be listed here. A missing required source column fails loudly rather than
# emitting a typed null. `gnomad_freq`/`clinvar` are backend-ignored
# passthroughs, off by default; a listed field absent on the input is dropped.
fields = ["in_silico_predictors"]
